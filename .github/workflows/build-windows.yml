name: Build Windows Installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build backend exe (PyInstaller)
        run: |
          cd backend
          pip install -r requirements.txt pyinstaller httpx
          pyinstaller --onefile --name pvs-backend --paths . run_backend.py `
            --collect-all pptx `
            --hidden-import uvicorn.logging `
            --hidden-import uvicorn.loops.auto `
            --hidden-import uvicorn.protocols.http.auto `
            --hidden-import uvicorn.protocols.http.h11_impl `
            --hidden-import uvicorn.protocols.websockets.auto `
            --hidden-import uvicorn.lifespan.on
          New-Item -ItemType Directory -Force ..\desktop\resources\pvs-backend | Out-Null
          Copy-Item dist\pvs-backend.exe ..\desktop\resources\pvs-backend\

      - name: Smoke test backend exe
        shell: pwsh
        run: |
          $env:PVS_PORT = "8765"
          $p = Start-Process -FilePath ".\desktop\resources\pvs-backend\pvs-backend.exe" -PassThru -WindowStyle Hidden
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 1
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:8765/health" -UseBasicParsing -TimeoutSec 2
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch {}
          }
          if (-not $ok) {
            Write-Host "=== backend smoke test FAILED ==="
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            exit 1
          }
          Write-Host "=== backend smoke test PASSED ==="
          $r2 = Invoke-WebRequest -Uri "http://127.0.0.1:8765/api/projects" -UseBasicParsing -TimeoutSec 5
          if ($r2.StatusCode -ne 200) { exit 1 }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue

      - name: Bundle FFmpeg (static build)
        shell: pwsh
        run: |
          $url = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          $bin = (Get-ChildItem ffmpeg_tmp -Directory | Select-Object -First 1).FullName + "\bin"
          New-Item -ItemType Directory -Force desktop\resources\ffmpeg | Out-Null
          Copy-Item "$bin\ffmpeg.exe" desktop\resources\ffmpeg\
          Copy-Item "$bin\ffprobe.exe" desktop\resources\ffmpeg\

      - name: Install frontend deps
        run: |
          cd desktop
          npm install

      - name: Build & package installer
        run: |
          cd desktop
          npm run build
          npx electron-builder --win

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: PPTVideoStudio-windows-installer
          path: desktop/dist/*.exe
